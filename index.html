    <!-- ERROR TRAP SCRIPT (Must be first) -->
    <script>
      window.logs = [];
      function logToScreen(msg, type) {
          const consoleEl = document.getElementById('debug-console');
          if (consoleEl) {
              const p = document.createElement('p');
              p.style.color = type === 'error' ? '#ff4444' : '#00ff00';
              p.style.margin = '4px 0';
              p.style.fontSize = '10px';
              p.innerText = '> ' + msg;
              consoleEl.appendChild(p);
          }
      }
      
      window.onerror = function(msg, url, line, col, error) {
          const txt = `ERR: ${msg} \nLine: ${line}`;
          logToScreen(txt, 'error');
          // Force show console if error occurs
          const splash = document.getElementById('splash-screen');
          const consoleEl = document.getElementById('debug-console');
          if(splash && consoleEl) {
             consoleEl.style.display = 'block';
             setTimeout(() => splash.style.opacity = '0.1', 1000); // Dim splash to see error
          }
      };
      
      window.onunhandledrejection = function(event) {
          logToScreen(`PROMISE ERR: ${event.reason}`, 'error');
      };
    </script>

    <script>
      (function() {
        const CURRENT_VERSION = "v_2.2.5_Stable"; 
        try {
            const storedVersion = localStorage.getItem('app_version_tag');
            if (storedVersion !== CURRENT_VERSION) {
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  for(let reg of regs) reg.unregister();
                });
              }
              if (window.caches) {
                 caches.keys().then(names => {
                     for (let name of names) caches.delete(name);
                 });
              }
              localStorage.setItem('app_version_tag', CURRENT_VERSION);
            }
        } catch (e) { console.error(e); }
      })();
    </script>

    <script>
      const statuses = ["Securing Data...", "Checking Cloud...", "Optimizing...", "Ready..."];
      let statusIdx = 0;
      const statusEl = document.getElementById('status-text');
      setInterval(() => {
          if (!statusEl) return;
          statusEl.style.opacity = '0';
          setTimeout(() => {
              statusIdx = (statusIdx + 1) % statuses.length;
              statusEl.innerText = statuses[statusIdx];
              statusEl.style.opacity = '1';
          }, 300);
      }, 1500);

      window.hardResetApp = function() {
          console.log("HARD RESET EXECUTED");
          if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                  for(let reg of regs) reg.unregister();
              });
          }
          localStorage.clear();
          sessionStorage.clear();
          window.location.href = window.location.pathname + "?v=" + Date.now();
      };

      // Watchdog: If not loaded in 7s, FORCE remove splash screen so user sees the error
      setTimeout(() => {
        const root = document.getElementById('root');
        const splash = document.getElementById('splash-screen');
        
        if (!root || root.innerHTML.trim() === '') {
           console.log("Watchdog Triggered: App unresponsive.");
           
           // Show the error console if hidden
           const consoleEl = document.getElementById('debug-console');
           if (consoleEl) consoleEl.style.display = 'block';

           // Fade out splash so we can see the error
           if (splash) splash.style.opacity = '0.1';
           
           // Show manual update button as backup
           document.getElementById('update-modal')?.classList.add('visible');
        }
      }, 7000); 
    </script>
